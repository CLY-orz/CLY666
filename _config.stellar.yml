######## Stellar info ########
stellar:
  version: '1.44.0'
  homepage: 'https://xaoxuu.com/wiki/stellar/'
  repo: 'https://github.com/xaoxuu/hexo-theme-stellar'
  main_css: /css/main.css
  main_js: /js/main.js


######## head tags ########
preconnect:
  - https://gcore.jsdelivr.net
  - https://unpkg.com
  - https://cdn.jsdelivr.net
  - https://cdnjs.cloudflare.com

canonical:
  originalHost:
  officialHosts:
    - localhost

open_graph:
  enable: true
  twitter_id:

structured_data:
  links: []


######## Sidebar ########
# 左上角显示的 logo 区域，包含图标、大标题、副标题
logo:
  avatar: /img/fantuan.jpg # 已修复：移除错误的占位符文本
  title: '[{config.title}](/)'
  subtitle: '{config.subtitle}'

# 侧边栏主功能导航菜单（1.44.0 正确的字段是 menubar.items）
menubar:
  columns: 4
  items:
    - id: post
      theme: '#1BCDFC'
      title: 博客
      url: /
    - id: tags
      theme: '#3DC550'
      title: 标签
      url: /tags/
    - id: categories
      theme: '#FA6400'
      title: 分类
      url: /categories/
    - id: archives
      theme: '#F44336'
      title: 归档
      url: /archives/
    - id: about
      theme: '#8E44AD'
      title: 关于
      url: /about/


######## Main ########
# 站点主结构树（1.44.0 正确的字段是 site_tree）
site_tree:
  home:
    leftbar: welcome, recent
    rightbar:
  index_blog:
    base_dir: blog
    menu_id: post
    leftbar: welcome, recent
    rightbar:
    nav_tabs: [] # 留空，不生成顶部那排“近期发布/分类/标签/归档”
  post:
    menu_id: post
    leftbar: related, recent
    rightbar: ghrepo, toc


######## Notebook ########
notebook:
  auto_excerpt: 128
  tagcons:
    '': quot:hashtag
  per_page: null
  order_by: -updated
  license: false
  share: false


######## Article ########
article:
  pin_style: carousel
  type: tech
  indent:
  cover_ratio: 2
  card_style: hero
  banner_ratio: 2.5
  auto_excerpt: 128
  category_color:
    '探索号': '#f44336'
  license: '本文采用 [署名-非商业性使用-相同方式共享 4.0 国际](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。'
  share:
  related_posts:
    enable: false
    max_count: 5
  reading_time: false
  card_tags: false
  tags: true

search:
  service: local_search
  local_search:
    field: all
    path: /search.json
    content: true
    lazy_load: true
    cache_ttl: 86400
    skip_search:

######## Comments ########
comments:
  service: utterances
  comment_title: 快来参与讨论吧~
  utterances:
    repo: CLY-orz/blog-comments # 已修复：填上你的仓库
    issue-term: pathname
    theme: preferred-color-scheme


######## Footer ########
footer:
  content: '本站由 CLY 创建。'

######## Tag Plugins ########
tag_plugins:
  note:
    default_color: ''
    border: true
  quot:
    default:
      prefix: quot:quote-left
      suffix: quot:quote-right
    hashtag:
      prefix: quot:hashtag
    question:
      prefix: quot:question
  emoji:
    default: https://gcore.jsdelivr.net/gh/cdn-x/emoticons@3.1/qq/{name}.gif
  gallery:
    layout: grid
    size: mix
    ratio: square


######## Plugins ########
plugins:
  fancybox:
    enable: true
  swiper:
    enable: true
  scrollreveal:
    enable: true
    distance: 8px
    duration: 1000
  copycode:
    enable: true
    default_text: 'Copy'
    success_text: 'Copied'
  adaptive_text:
    enable: true
  card_hover:
    enable: false
  heti:
    enable: false


######## Style ########
style:
  prefers_theme: auto
  page_transition:
    enable: true
  color:
    theme: 'hsl(192 98% 55%)'
    accent: 'hsl(14 100% 57%)'
    link: 'hsl(207 90% 54%)'
  animated_avatar:
    animate: auto
  leftbar:
    ui-style: card
    background-color-light: var(--card)
    background-color-dark: var(--card)
    blur-px: 100px
    blur-bg: var(--bg-a60)
    background-opacity: 0.8
  error_page: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/404/1c830bfcd517d.svg
  site:
    blur-px: 100px
    blur-bg: var(--bg-a75)
    blur-sat: 300%


######## Default Assets ########
default:
  avatar: /img/fantuan.jpg
  cover: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/cover/76b86c0226ffd.svg
  image: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/image/2659360.svg
  banner: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/banner/books.jpg


######## API Host ########
api_host:
  ghapi: api.github.com
  ghraw: raw.githubusercontent.com
  gist: gist.github.com
  ghcard: github-readme-stats.vercel.app


######## System ########
system:
  override_pretty_urls: true

inject:
  head:
    - <style>body .navbar.top { display: none !important; }</style>